<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel's Transactions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #0a1628 0%, #0f2440 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 20px;
        }

        .header-icon {
            width: 50px;
            height: 50px;
            background: #1a3a5c;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            border: 1px solid #2a5a8c;
        }

        .header-icon svg {
            width: 24px;
            height: 24px;
            fill: #ffd700;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
        }

        .card {
            background: #f5f5f5;
            border-radius: 20px;
            padding: 25px;
            color: #1a1a1a;
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #1a1a1a;
        }

        .amount-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .amount-btn {
            padding: 16px 8px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: #fff;
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .amount-btn:hover {
            border-color: #1a1a1a;
            background: #f0f0f0;
        }

        .amount-btn.selected {
            border-color: #1a1a1a;
            background: #1a1a1a;
            color: #fff;
        }

        .custom-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            background: #fff;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .custom-input:focus {
            border-color: #1a1a1a;
        }

        .custom-input::placeholder {
            color: #999;
        }

        .pay-btn {
            width: 100%;
            padding: 18px;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .pay-btn:hover {
            opacity: 0.9;
        }

        .pay-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
            text-align: center;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.41 16.09V20h-2.67v-1.93c-1.71-.36-3.16-1.46-3.27-3.4h1.96c.1 1.05.82 1.87 2.65 1.87 1.96 0 2.4-.98 2.4-1.59 0-.83-.44-1.61-2.67-2.14-2.48-.6-4.18-1.62-4.18-3.67 0-1.72 1.39-2.84 3.11-3.21V4h2.67v1.95c1.86.45 2.79 1.86 2.85 3.39H14.3c-.05-1.11-.64-1.87-2.22-1.87-1.5 0-2.4.68-2.4 1.64 0 .84.65 1.39 2.67 1.91s4.18 1.39 4.18 3.91c-.01 1.83-1.38 2.83-3.12 3.16z"/>
                </svg>
            </div>
            <h1>Daniel's Transactions</h1>
        </div>

        <div class="card">
            <div class="card-title">Select Amount</div>

            <div class="amount-grid">
                <button class="amount-btn" onclick="selectAmount(5)">GH₵ 5</button>
                <button class="amount-btn" onclick="selectAmount(10)">GH₵ 10</button>
                <button class="amount-btn" onclick="selectAmount(15)">GH₵ 15</button>
                <button class="amount-btn" onclick="selectAmount(20)">GH₵ 20</button>
                <button class="amount-btn" onclick="selectAmount(25)">GH₵ 25</button>
                <button class="amount-btn" onclick="selectAmount(50)">GH₵ 50</button>
                <button class="amount-btn" onclick="selectAmount(100)">GH₵ 100</button>
                <button class="amount-btn" onclick="selectAmount(200)">GH₵ 200</button>
                <button class="amount-btn" onclick="selectAmount(500)">GH₵ 500</button>
            </div>

            <input 
                type="number" 
                class="custom-input" 
                id="customAmount" 
                placeholder="Or enter custom amount (GH₵)" 
                oninput="clearSelection()"
            >

            <div class="success-message" id="successMsg"></div>
            <div class="error-message" id="errorMsg"></div>

            <button class="pay-btn" id="payBtn" onclick="payWithXcel()">
                Proceed to Payment
            </button>
        </div>
    </div>

    <script>
        let selectedAmount = null;
        const DANIEL_EMAIL = 'danielekutor441@gmail.com';
        const API_BASE_URL = 'https://daniel-secret.onrender.com';

        function selectAmount(amount) {
            selectedAmount = amount;
            document.getElementById('customAmount').value = amount;

            document.querySelectorAll('.amount-btn').forEach(btn => {
                btn.classList.remove('selected');
                if (parseInt(btn.textContent.replace(/\\D/g, '')) === amount) {
                    btn.classList.add('selected');
                }
            });
        }

        function clearSelection() {
            selectedAmount = null;
            document.querySelectorAll('.amount-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
        }

        function getAmount() {
            if (selectedAmount) return selectedAmount;
            const custom = document.getElementById('customAmount').value;
            if (custom && custom > 0) return parseFloat(custom);
            return null;
        }

        async function payWithXcel() {
            const amount = getAmount();
            const successMsg = document.getElementById('successMsg');
            const errorMsg = document.getElementById('errorMsg');
            const payBtn = document.getElementById('payBtn');

            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';

            if (!amount || amount <= 0) {
                alert('Please select or enter an amount');
                return;
            }

            payBtn.disabled = true;
            payBtn.textContent = 'Processing...';

            const clientTransactionId = 'TXN_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);

            const payload = {
                amount: amount.toString(),
                currency: 'GHS',
                client_transaction_id: clientTransactionId,
                customer_email: DANIEL_EMAIL,
                channel: 'WEB',
                description: 'Payment to Daniel',
                redirect_url: window.location.href,
                metadata: { source: 'daniel_transactions_page' }
            };

            try {
                const response = await fetch(API_BASE_URL + '/api/pay', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.data && data.data.payment_link) {
                    window.location.href = data.data.payment_link;
                } else {
                    throw new Error(data.status_reason || data.message || JSON.stringify(data));
                }
            } catch (error) {
                errorMsg.textContent = 'Error: ' + error.message;
                errorMsg.style.display = 'block';
                payBtn.disabled = false;
                payBtn.textContent = 'Proceed to Payment';
                console.error('Payment error:', error);
            }
        }
    </script>
</body>
</html>
